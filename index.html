<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EBA</title><style>body{margin:0;font-family:Arial;background:#f2f2f2}button{padding:10px;border:0;border-radius:10px;font-weight:800} .m{display:flex} .m button{flex:1;background:#fff} .m button.on{color:red;border-bottom:3px solid red} .p{display:none;padding:10px} .p.on{display:block} .card{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px}</style></head><body><div style="background:#fff;padding:10px"><b>EBA ARDABABA 5-8</b></div><div class="m"><button id="m1" class="on" onclick="g(1)">Ana</button><button id="m2" onclick="g(2)">Ders</button><button id="m3" onclick="g(3)">Sinav</button></div><div id="p1" class="p on"><button onclick="c=5;u()">5</button><button onclick="c=6;u()">6</button><button onclick="c=7;u()">7</button><button onclick="c=8;u()">8</button><div class="card"><h2 id="t">5.Sinif</h2><p id="pr">0/4</p></div><div id="a"></div></div><div id="p2" class="p"></div><div id="p3" class="p"><div id="sb"></div><button style="background:red;color:#fff;width:100%;padding:10px;border-radius:20px" onclick="sbx()">Baslat</button><h2 id="pu"></h2></div><script>var c=5;var d={5:["Kesirler","Gunes","Deyimler","Haklar"],6:["Tam Sayi","Yogunluk","Fiiller","Tarih"],7:["Oran","Hucre","Cumle","Osmanli"],8:["Carpanlar","DNA","Fiilimsi","Inkilap"]};var b={"5":[],"6":[],"7":[],"8":[]};function g(n){for(i=1;i<=3;i++){document.getElementById("p"+i).classList.remove("on");document.getElementById("m"+i).classList.remove("on");}document.getElementById("p"+n).classList.add("on");document.getElementById("m"+n).classList.add("on");}function u(){document.getElementById("t").innerText=c+".Sinif";var h="";for(i=0;i<d[c].length;i++){h+='<div class="card"><b>'+d[c][i]+'</b><button style="background:#0b6fc2;color:#fff;width:100%;margin-top:5px" onclick="window.open(\'https://youtu.be/9TslrA8a3kA\',\'_blank\')">Video</button><button style="background:red;color:#fff;width:100%;margin-top:5px" onclick="bt('+i+')">Bitir</button></div>';}document.getElementById("a").innerHTML=h;document.getElementById("p2").innerHTML=h;r();}function r(){document.getElementById("pr").innerText=(b[c].length)+"/"+d[c].length;}function bt(i){if(b[c].indexOf(i)<0)b[c].push(i);r();alert("Bitti");}function sbx(){document.getElementById("sb").innerHTML='<div class="card">5 karesi?<br><button onclick="ok(1)">25</button> <button onclick="ok(0)">10</button></div><div class="card">H2O?<br><button onclick="ok(1)">Su</button> <button onclick="ok(0)">Tuz</button></div>';}function ok(x){if(x)document.getElementById("pu").innerText="Puan 100";}u();</script></body></html>
