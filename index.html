<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBA</title>
<style>
body{margin:0;font-family:Arial;background:#f0f0f0}
.ust{background:#e30613;color:#fff;padding:12px;font-size:22px;font-weight:900;text-align:center}
.menu{display:flex;background:#fff}
.menu button{flex:1;border:0;padding:14px;font-weight:700;background:#fff}
.menu button.aktif{color:#e30613;border-bottom:3px solid #e30613}
.sayfa{display:none;padding:12px}
.sayfa.aktif{display:block}
.kart{background:#fff;padding:14px;border-radius:10px;margin-bottom:10px}
.btn{background:#e30613;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div class="ust">EBA - ARDABABA</div>
<div class="menu">
<button id="b1" class="aktif" onclick="sayfa1()">Ana Sayfa</button>
<button id="b2" onclick="sayfa2()">Dersler</button>
<button id="b3" onclick="sayfa3()">Sinav</button>
</div>

<div id="s1" class="sayfa aktif">
<div class="kart">
<h3>Merhaba Arda!</h3>
<p>LGS 2027 icin calis</p>
<button class="btn" onclick="sayfa2()">DERSLERE GIT</button>
</div>
</div>

<div id="s2" class="sayfa">
<div class="kart">
<h3>Matematik Dersi</h3>
<iframe width="100%" height="180" src="https://www.youtube.com/embed/3h7dD2yN1eU" frameborder="0" allowfullscreen></iframe>
<p>EBOB en buyuk ortak bolen</p>
<button class="btn" onclick="alert('Dogru! EBOB 6')">Soruyu Cevapla</button>
</div>
<div class="kart">
<h3>Fen Dersi</h3>
<button class="btn" onclick="alert('DNA cift sarmal!')">Bilgiyi Goster</button>
</div>
</div>

<div id="s3" class="sayfa">
<div class="kart">
<h3>LGS Deneme</h3>
<p>5 in karesi kac?</p>
<button class="btn" onclick="alert('Dogru 25! 100 Puan')">25</button>
<button class="btn" style="background:#ddd;color:#000;margin-top:8px" onclick="alert('Yanlis!')">10</button>
</div>
</div>

<script>
function hepsiniKapat(){
document.getElementById('s1').classList.remove('aktif');
document.getElementById('s2').classList.remove('aktif');
document.getElementById('s3').classList.remove('aktif');
document.getElementById('b1').classList.remove('aktif');
document.getElementById('b2').classList.remove('aktif');
document.getElementById('b3').classList.remove('aktif');
}
function sayfa1(){hepsiniKapat();document.getElementById('s1').classList.add('aktif');document.getElementById('b1').classList.add('aktif');}
function sayfa2(){hepsiniKapat();document.getElementById('s2').classList.add('aktif');document.getElementById('b2').classList.add('aktif');}
function sayfa3(){hepsiniKapat();document.getElementById('s3').classList.add('aktif');document.getElementById('b3').classList.add('aktif');}
alert('EBA Acildi! Dugmeler simdi calisacak');
</script>
</body>
</html>
