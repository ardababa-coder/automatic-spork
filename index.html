<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBA Ardababa Full</title>
<style>
:root{--mavi:#0b6fc2;--kirmizi:#ef4444;--bg:#f1f5f9}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);padding-bottom:70px}
.top{background:#fff;color:#000;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0001}
.logo{width:52px;height:52px;background:#fff;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 8px #0001;overflow:hidden}
.lgs{background:var(--kirmizi);color:#fff;text-align:center;padding:8px;font-weight:800;font-size:13px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:20}
.tabbar button{flex:1;border:0;background:#fff;padding:10px 2px;font-size:11px;font-weight:700}
.tabbar button.aktif{color:var(--mavi);border-top:3px solid var(--mavi)}
.sayfa{display:none;padding:12px}.sayfa.aktif{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001}
.card img{width:100%;height:110px;object-fit:cover}.ic{padding:10px}
.btn{width:100%;background:var(--mavi);color:#fff;border:0;padding:10px;border-radius:10px;font-weight:800;margin-top:6px}
.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.soru{background:#fff;border:2px solid #e2e8f0;padding:12px;border-radius:12px;margin:10px 0;cursor:pointer}
.soru.dogru{background:#dcfce7;border-color:#22c55e}.soru.yanlis{background:#fee2e2;border-color:#ef4444}
.kutu{background:#fff;padding:14px;border-radius:14px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:12px;border-radius:10px;border:2px solid #ddd;margin:6px 0}
</style></head>
<body>
<div class="top">
<div class="logo">
<!-- LOGO SVG BURADA -->
<svg viewBox="0 0 100 100" width="52" height="52"><path d="M50 8 L85 22 L85 24 L88 24 L88 38 L85 38 L85 30 L50 44 L15 30 L15 38 L12 38 L12 24 L15 24 L15 22 Z" fill="#ef4444"/><path d="M20 48 Q50 58 80 48 L80 70 Q50 80 20 70 Z" fill="#0b6fc2"/><path d="M10 50 L10 75 Q10 78 20 78 Q50 85 80 78 Q90 78 90 75 L90 50 L85 50 L85 72 Q50 82 15 72 L15 50 Z" fill="#0b6fc2"/></svg>
</div>
<div><div style="font-weight:900;color:var(--mavi);font-size:20px;letter-spacing:1px">EBA</div><div style="font-size:11px;color:var(--kirmizi);font-weight:700;letter-spacing:2px">ARDABABA AKADEMI</div></div>
<div style="margin-left:auto;font-weight:700" id="adYeri">Misafir</div>
</div>
<div class="lgs" id="lgsSayac">LGS Yükleniyor...</div>

<div id="s-anasayfa" class="sayfa aktif">
<div class="kutu"><h3 style="margin:0">Hoşgeldin! 👋</h3><input id="adInput" placeholder="Adını yaz (Arda)"><button class="btn" onclick="kaydetAd()">Kaydet ve Başla</button></div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400"><div class="ic"><b>Matematik</b><br>8 Konu<button class="btn" onclick="tabAc('dersler')">Derslere Git</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400"><div class="ic"><b>LGS Deneme</b><br>Süre: 20dk<button class="btn" onclick="tabAc('sinav')">Sınavı Başlat</button></div></div>
</div>
<div class="kutu" style="margin-top:10px"><b>📈 İlerlemen:</b> <span id="ilerleme">0 ders</span><br><progress id="prog" value="0" max="100" style="width:100%"></progress></div>
</div>

<div id="s-dersler" class="sayfa"><div class="kutu"><h2 style="margin:0">📚 Tüm Dersler (Hepsi Çalışıyor)</h2></div><div id="dersListesi"></div><div id="dersDetay" style="display:none" class="kutu"></div></div>
<div id="s-sinav" class="sayfa"><div class="kutu"><h2 style="margin:0">📝 LGS Deneme</h2><p id="sure">Süre: 20:00</p><div id="sinavAlani"></div><button class="btn" onclick="sinavBaslat()">Sınavı Başlat</button></div></div>
<div id="s-kutuphane" class="sayfa"><div class="kutu"><h2>Kütüphane 📖</h2><div class="soru" onclick="window.open('https://eba.gov.tr/kutuphane','_blank')">📖 8. Sınıf Kitapları - AÇ</div><div class="soru"><iframe class=video src="https://www.youtube.com/embed/5MgBikgcWnY"></iframe><br>Motivasyon Videosu</div></div></div>

<div class="tabbar">
<button id="t-anasayfa" class="aktif" onclick="tabAc('anasayfa')">🏠<br>Ana Sayfa</button>
<button id="t-dersler" onclick="tabAc('dersler')">📚<br>Dersler</button>
<button id="t-sinav" onclick="tabAc('sinav')">📝<br>Sınav</button>
<button id="t-kutuphane" onclick="tabAc('kutuphane')">📖<br>Kütüphane</button>
