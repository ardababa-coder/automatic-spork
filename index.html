<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBA - Ardababa</title>
<style>body{margin:0;font-family:sans-serif;background:#f0f4f8}.top{background:#0f6fc5;color:#fff;padding:14px;text-align:center;font-size:20px;font-weight:900}.lgs{background:red;color:#fff;text-align:center;padding:10px;font-weight:bold}.grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px #0002}.card img{width:100%;height:110px;object-fit:cover}.ic{padding:8px}.btn{width:100%;background:#0f6fc5;color:#fff;border:0;padding:9px;border-radius:8px;font-weight:800}</style></head>
<body>
<div class="top">EBA - ARDABABA AKADEMI</div>
<div class="lgs" id="lgs">LGS 2026 Yükleniyor...</div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400"><div class="ic"><b>Matematik</b><br>Çarpanlar<button class="btn" onclick="alert('Ders başladı!')">Başlat ▶</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=400"><div class="ic"><b>Fen</b><br>DNA<button class="btn" onclick="alert('Ders başladı!')">Başlat ▶</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=400"><div class="ic"><b>Türkçe</b><br>Fiilimsiler<button class="btn" onclick="alert('Ders başladı!')">Başlat ▶</button></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400"><div class="ic"><b>LGS Deneme</b><br>90 Soru<button class="btn" onclick="alert('Sınav başladı!')">Başlat ▶</button></div></div>
</div>
<script>let h=new Date("2026-06-14").getTime();setInterval(()=>{let k=h-Date.now();let g=Math.floor(k/86400000);document.getElementById('lgs').innerHTML="⏳ LGS'ye "+g+" Gün Kaldı - Hoşgeldin Arda!";},1000)</script>
</body></html>
