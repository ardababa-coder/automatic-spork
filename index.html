
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arda Bilişim Sınavı</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#fff;color:#172033;font-family:Arial,sans-serif}
.container{max-width:560px;margin:auto}
header,.card{background:#f5f7fa;border:1px solid #e1e7ef;border-radius:15px;padding:18px;margin-bottom:15px}
header{text-align:center}
.school-head{display:flex;align-items:center;gap:12px;text-align:left}
.school-logo{width:65px;height:65px;object-fit:contain;display:none}
.school-name{font-size:13px}
h1{color:#087da8;font-size:23px}
input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd5df;border-radius:8px;background:white;font-size:16px}
button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:9px;background:#00bce8;color:#102030;font-size:16px;font-weight:bold}
button:disabled{opacity:.45}
.teacher-link{background:#e2eaf2}
.option{display:block;padding:13px;margin:9px 0;background:#e9eff5;border-radius:8px}
.option input{width:auto}
.hidden{display:none}
.muted{color:#657386}
.review{background:#edf2f7;padding:12px;border-radius:9px;margin:9px 0}
.correct{color:green}.wrong{color:#d22}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
#logoFile{display:none}
.logo-picker{display:inline-block;background:#e5edf5;padding:9px;border-radius:8px;margin:10px}
.soru-foto{display:block;width:100%;max-height:210px;object-fit:cover;border-radius:12px;margin:10px 0;background:#e9eff5}
</style>
</head>
<body>
<div class="container">
<header>
<div class="school-head">
<img id="schoolLogo" class="school-logo" alt="Okul logosu">
<div class="school-name"><b>ATİKEHANIM ORTAOKULU</b><br>Okul Online Sınav Sistemi</div>
</div>
<label class="logo-picker" for="logoFile">📷 Okul logosunu telefondan seç</label>
<input id="logoFile" type="file" accept="image/*">
<h1>💻 ARDA BİLİŞİM SINAVI</h1>
<p>5. ve 6. Sınıf Online Sınav Sistemi</p>
</header>

<section class="card" id="login">
<h2>Öğrenci Bilgileri</h2>
<input id="ad" placeholder="Adınız">
<input id="soyad" placeholder="Soyadınız">
<input id="numara" placeholder="Okul numaranız">
<select id="sube">
<option value="">Şubenizi seçin</option>
<option>5/A</option><option>5/B</option><option>5/C</option><option>5/D</option>
<option>6/A</option><option>6/B</option><option>6/C</option><option>6/D</option>
</select>
<button onclick="basla()">Sınava Başla</button>
<button class="teacher-link" onclick="ogretmenGiris()">👩‍🏫 Öğretmen Girişi</button>
</section>

<section class="card hidden" id="ogretmenLogin">
<h2>Öğretmen Girişi</h2>
<input id="ogretmenSifre" type="password" placeholder="Öğretmen şifresi">
<button onclick="ogretmenKontrol()">Panele Gir</button>
<button class="teacher-link" onclick="ogretmenGeri()">Geri Dön</button>
</section>

<section class="card hidden" id="ogretmenPanel">
<h2>📋 Öğretmen Paneli</h2>
<div id="sonucListesi"></div>
<button onclick="sonuclariIndir()">Sonuçları CSV İndir</button>
<button class="teacher-link" onclick="ogretmenCikis()">Çıkış</button>
</section>

<section class="card hidden" id="sinav">
<h2 id="baslik"></h2>
<p id="ogrenciBilgi" class="muted"></p>
<p id="ilerleme"></p>
<div id="soru"></div>
<button onclick="onceki()" id="geri">Önceki Soru</button>
<button onclick="sonraki()">Sonraki Soru</button>
<button onclick="bitir()" style="background:#36d98b">Sınavı Bitir</button>
</section>

<section class="card hidden" id="sonuc">
<h2>🏆 Sınav Sonucu</h2>
<h3 id="isim"></h3>
<h1 id="puan"></h1>
<p id="dogru"></p>
<p id="yanlis"></p>
<div id="inceleme"></div>
<button onclick="location.reload()">Yeniden Sınav</button>
</section>
</div>

<script>
document.getElementById("logoFile").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{const i=document.getElementById("schoolLogo");i.src=r.result;i.style.display="block"};
 r.readAsDataURL(f);
});

const sorular={
5:[
["Bilgisayarın fiziksel parçalarına ne denir?",["Yazılım","Donanım","İnternet","Dosya"],1],
["Aşağıdakilerden hangisi giriş birimidir?",["Monitör","Yazıcı","Klavye","Hoparlör"],2],
["Bilgisayarın temel işlem merkezi hangisidir?",["İşlemci","Fare","Ekran","Yazıcı"],0],
["İnternet ne için kullanılabilir?",["Bilgi paylaşımı","Sadece oyun","Bilgisayarı kapatma","Yazdırma"],0],
["Güçlü şifre hangisidir?",["123456","abcdef","Arda2026!X","111111"],2],
["Dosyaları düzenli tutmak için ne kullanılır?",["Klasör","Hoparlör","Fare","Mikrofon"],0],
["Aşağıdakilerden hangisi yazılımdır?",["Klavye","Windows","Fare","Ekran"],1],
["Kişisel bilgilerimizi internette nasıl korumalıyız?",["Herkese vermeliyiz","Gereksiz yere paylaşmamalıyız","Yayınlamalıyız","Şifreyi göndermeliyiz"],1],
["Silinen dosyalar genellikle nereye gider?",["Masaüstü","Geri Dönüşüm Kutusu","İndirilenler","Belgeler"],1],
["Bilgisayarda yazı yazmak için hangisi kullanılır?",["Klavye","Hoparlör","Yazıcı","Monitör"],0],
["Algoritma nedir?",["Bir işi çözmek için sıralı adımlar","Bilgisayar parçası","Oyun türü","Dosya adı"],0],
["E-posta ne için kullanılır?",["Elektronik mesaj göndermek","Bilgisayarı açmak","Resim çizmek","Ses dinlemek"],0],
["Aşağıdakilerden hangisi çıkış birimidir?",["Fare","Klavye","Monitör","Mikrofon"],2],
["Siber zorbalık nedir?",["İnternette birini rahatsız etmek","Ders çalışmak","Araştırma yapmak","Dosya kaydetmek"],0],
["Bilgisayar virüsü nedir?",["Zararlı yazılım","Donanım","Klavye","Ekran"],0],
["İnternette güvenli davranış hangisidir?",["Şifreyi paylaşmak","Bilinmeyen bağlantıya basmak","Güvenilir siteleri kullanmak","Adresini herkese vermek"],2],
["Sunum hazırlamak için hangisi kullanılabilir?",["PowerPoint","Hesap makinesi","Mikrofon","Fare"],0],
["Bilgisayarda ses dinlemek için hangisi kullanılır?",["Hoparlör","Klavye","Tarayıcı","Yazıcı"],0]
],
6:[
["Bilgisayarın temel işlem birimi hangisidir?",["RAM","CPU","USB","Ekran"],1],
["RAM ne işe yarar?",["Çalışma sırasında verileri geçici tutar","Yazı yazdırır","Ses çıkarır","İnternete bağlar"],0],
["Aşağıdakilerden hangisi işletim sistemidir?",["Windows","Klavye","Fare","Monitör"],0],
["İnternet tarayıcısı hangisidir?",["Chrome","Word","Paint","Excel"],0],
["Algoritma ne demektir?",["Adım adım işlem sırası","Bilgisayar oyunu","Donanım parçası","İnternet adresi"],0],
["Akış şeması neyi gösterir?",["İşlem adımlarını","Bilgisayar rengini","Dosya boyutunu","Şifreyi"],0],
["Güvenli internet kullanımı hangisidir?",["Şifre paylaşmak","Bilinmeyen dosya indirmek","Güçlü şifre kullanmak","Adresini herkese vermek"],2],
["Telif hakkı neyi korur?",["Eser sahibinin haklarını","Bilgisayar hızını","İnternet bağlantısını","Klavye tuşlarını"],0],
["Kimlik avı nedir?",["Kişisel bilgileri kandırarak ele geçirme girişimi","Oyun türü","Dosya biçimi","Yazıcı modeli"],0],
["Veri nedir?",["İşlenebilecek bilgi veya ölçüm","Bilgisayar kasası","Fare","Ekran"],0],
["İkili sayı sisteminde hangi rakamlar kullanılır?",["0 ve 1","1 ve 2","0 ve 2","2 ve 3"],0],
["1 byte kaç bittir?",["4","8","16","32"],1],
["Elektronik tablo hazırlamak için hangisi kullanılır?",["Excel","Paint","Chrome","Not Defteri"],0],
["Sunum hazırlamak için hangisi kullanılır?",["PowerPoint","Chrome","Windows","Hesap makinesi"],0],
["Dosya uzantısı genellikle neyi belirtir?",["Dosya türünü","Ekran boyutunu","Şifreyi","Kullanıcı adını"],0],
["Verileri kaybetmemek için ne yapılmalıdır?",["Yedekleme","Rastgele silme","Şifreyi paylaşma","Bilinmeyen dosya indirme"],0],
["Bilgisayar ağı nedir?",["Birbirine bağlı cihazlar topluluğu","Tek klavye","Bir program","Bir dosya"],0],
["LAN neyi ifade eder?",["Yerel alan ağı","Geniş alan ağı","İnternet sitesi","İşlemci"],0],
["Arama motoru hangisidir?",["Google","Word","Paint","Excel"],0],
["Dijital erişilebilirlik neyi amaçlar?",["Teknolojinin farklı ihtiyaçları olan kişilerce kullanılabilmesini","Bilgisayarı kapatmayı","Dosya silmeyi","Oyun yapmayı"],0],
["Siber zorbalıkla karşılaşınca ne yapılmalıdır?",["Güvenilir bir yetişkine bildirmek","Karşılık vermek","Gizlemek","Yaymak"],0],
["Güncellemeler neden yapılır?",["Güvenlik ve iyileştirmeler için","Dosyaları rastgele silmek için","Şifreyi paylaşmak için","Ekranı kapatmak için"],0],
["Açık kaynak yazılım ne anlama gelir?",["Kaynak kodu incelemeye açık yazılım","Sadece ücretli yazılım","Virüs","Donanım"],0],
["Bulut depolama ne sağlar?",["İnternet üzerinden dosya saklama","Ekranı büyütme","Ses yükseltme","Yazdırma"],0],
["Güçlü şifre nasıl olmalıdır?",["Tahmin edilmesi zor ve farklı karakterler içeren","Sadece 1234","Herkesin bildiği","Ad-soyaddan oluşan"],0],
["Robotların çevreyi algılamasında ne kullanılır?",["Sensör","Yazıcı","Hoparlör","Klavye"],0],
["Programlama nedir?",["Bilgisayara belirli komutlar verme","Dosya yazdırma","Ekran temizleme","İnternet kapatma"],0],
["Koşul yapısı ne işe yarar?",["Bir koşula göre farklı işlem yapar","Sesi artırır","Dosya siler","Ekranı kapatır"],0],
["Döngü yapısı ne işe yarar?",["Komutları tekrarlar","Bilgisayarı kapatır","Şifre değiştirir","Dosya taşır"],0],
["Yapay zekâ ne yapabilir?",["Verilerden örüntüler öğrenip tahmin üretebilir","Sadece yazdırır","Klavye görevi görür","Elektrik üretir"],0]
]
};

const OGRETMEN_SIFRESI="ogretmen2026";
let liste=[],index=0,cevaplar=[],ogrenci={};

function sonuclariOku(){
 try{return JSON.parse(localStorage.getItem("ardaSinavSonuclari")||"[]")}
 catch(e){return []}
}
function ogretmenGiris(){document.getElementById("login").classList.add("hidden");document.getElementById("ogretmenLogin").classList.remove("hidden")}
function ogretmenGeri(){document.getElementById("ogretmenLogin").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function ogretmenKontrol(){
 if(document.getElementById("ogretmenSifre").value!==OGRETMEN_SIFRESI){alert("Şifre yanlış.");return}
 document.getElementById("ogretmenLogin").classList.add("hidden");
 document.getElementById("ogretmenPanel").classList.remove("hidden");sonuclariGoster();
}
function ogretmenCikis(){
 document.getElementById("ogretmenPanel").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("ogretmenSifre").value="";
}
function guvenli(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sonuclariGoster(){
 const arr=sonuclariOku(),alan=document.getElementById("sonucListesi");
 if(!arr.length){alan.innerHTML="<p>Henüz kayıtlı sonuç yok.</p>";return}
 alan.innerHTML='<div class="table-wrap"><table><tr><th>Öğrenci</th><th>Sınıf</th><th>Doğru</th><th>Yanlış/Boş</th><th>Puan</th></tr>'+
 arr.map(x=>`<tr><td>${guvenli(x.ad)}</td><td>${guvenli(x.sube)}</td><td>${x.dogru}</td><td>${x.yanlis}</td><td>${x.puan}</td></tr>`).join("")+'</table></div>';
}
function sonuclariIndir(){
 const arr=sonuclariOku();if(!arr.length){alert("İndirilecek sonuç yok.");return}
 let csv="Ad Soyad;Numara;Sınıf;Doğru;Yanlış/Boş;Puan;Tarih\n";
 arr.forEach(x=>csv+=`${x.ad};${x.numara};${x.sube};${x.dogru};${x.yanlis};${x.puan};${x.tarih}\n`);
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
 a.download="sinav-sonuclari.csv";a.click();URL.revokeObjectURL(a.href);
}
function basla(){
 const ad=document.getElementById("ad").value.trim(),soyad=document.getElementById("soyad").value.trim();
 const numara=document.getElementById("numara").value.trim(),sube=document.getElementById("sube").value;
 if(!ad||!soyad||!numara||!sube){alert("Lütfen bütün bilgileri doldurun.");return}
 ogrenci={ad:ad+" "+soyad,numara,sube};liste=sorular[sube[0]];
 cevaplar=Array(liste.length).fill(null);index=0;
 document.getElementById("login").classList.add("hidden");document.getElementById("sinav").classList.remove("hidden");
 document.getElementById("baslik").textContent=sube[0]+". Sınıf Bilişim Teknolojileri Sınavı";
 document.getElementById("ogrenciBilgi").textContent=ogrenci.ad+" | "+sube;soruGoster();
}
function soruGoster(){
 const s=liste[index],metin=s[0].toLocaleLowerCase("tr-TR");
 document.getElementById("ilerleme").textContent=`Soru ${index+1} / ${liste.length}`;
 let foto="https://images.unsplash.com/photo-1518770660439-4636190af475?w=900";
 if(metin.includes("klavye")||metin.includes("yazı"))foto="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=900";
 else if(metin.includes("robot")||metin.includes("sensör"))foto="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=900";
 else if(metin.includes("şifre")||metin.includes("güven")||metin.includes("zorbalık")||metin.includes("kimlik avı"))foto="https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=900";
 else if(metin.includes("internet")||metin.includes("ağ")||metin.includes("tarayıcı")||metin.includes("arama motoru"))foto="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900";
 else if(metin.includes("program")||metin.includes("algoritma")||metin.includes("döngü")||metin.includes("koşul")||metin.includes("akış şeması"))foto="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=900";
 else if(metin.includes("sunum")||metin.includes("veri")||metin.includes("excel"))foto="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900";
 let html=`<h3>${index+1}. ${s[0]}</h3><img class="soru-foto" src="${foto}" alt="Bilişim konusu görseli" loading="lazy" onerror="this.style.display='none'">`;
 s[1].forEach((secenek,i)=>{html+=`<label class="option"><input type="radio" name="cevap" value="${i}" ${cevaplar[index]===i?"checked":""} onchange="cevaplar[index]=${i}"> ${secenek}</label>`});
 document.getElementById("soru").innerHTML=html;
 document.getElementById("geri").disabled=index===0;
}
function onceki(){if(index>0){index--;soruGoster()}}
function sonraki(){if(index<liste.length-1){index++;soruGoster()}}
function bitir(){
 if(!confirm("Sınavı bitirmek istiyor musunuz?"))return;
 let dogru=0,yanlis=0,incelemeHTML="";
 liste.forEach((s,i)=>{
 if(cevaplar[i]===s[2])dogru++;else yanlis++;
 if(cevaplar[i]!==s[2]){
 const verilen=cevaplar[i]===null?"Boş":s[1][cevaplar[i]];
 incelemeHTML+=`<div class="review"><b>${i+1}. ${s[0]}</b><p class="wrong">Senin cevabın: ${guvenli(verilen)}</p><p class="correct">Doğru cevap: ${guvenli(s[1][s[2]])}</p></div>`;
 }
 });
 const puan=Math.round(dogru/liste.length*100),kayit={...ogrenci,dogru,yanlis,puan,tarih:new Date().toLocaleString("tr-TR")};
 const arr=sonuclariOku();arr.push(kayit);
 try{localStorage.setItem("ardaSinavSonuclari",JSON.stringify(arr))}catch(e){alert("Sonuç bu cihazda kaydedilemedi.")}
 document.getElementById("sinav").classList.add("hidden");document.getElementById("sonuc").classList.remove("hidden");
 document.getElementById("isim").textContent=ogrenci.ad;
 document.getElementById("puan").textContent=puan+" PUAN";
 document.getElementById("dogru").textContent="Doğru: "+dogru;
 document.getElementById("yanlis").textContent="Yanlış / Boş: "+yanlis;
 document.getElementById("inceleme").innerHTML=incelemeHTML||"<p class='correct'>Tebrikler, bütün sorular doğru!</p>";
}
</script>
</body>
 </html>
